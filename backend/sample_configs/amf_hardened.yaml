# Hardened AMF Configuration (3GPP TS 33.501 Compliant)
amf:
  sbi:
    scheme: https
    addr: 10.10.0.1
    port: 7777
    tls:
      enabled: true
      cert: /etc/5g/certs/amf.crt
      key: /etc/5g/certs/amf.key
      min_version: "1.3"
  ngap:
    addr: 192.168.10.1
  guami:
    plmn_id:
      mcc: 999
      mnc: 70
    amf_id:
      region: 2
      set: 1
  tai:
    plmn_id:
      mcc: 999
      mnc: 70
    tac: 1
  security:
    integrity_order: [NIA2, NIA1]
    ciphering_order: [NEA2, NEA1]
  oam:
    addr: 127.0.0.1
    port: 9090
    tls:
      enabled: true
